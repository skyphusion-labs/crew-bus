name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-crew-bus-${{ github.ref }}
  cancel-in-progress: true

# npm workspaces: single root package-lock.json. Install once at repo root,
# then run each package's scripts from its working-directory (node_modules
# is hoisted / linked by the workspace install).
#
# PUBLIC-repo rule (fc#394): GitHub-hosted runners only. Org fleet pool has
# allows_public_repositories=false so fork PRs never execute on fleet iron.

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspace root)
        working-directory: .
        run: npm ci
      - run: npm run typecheck
      - run: npm test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspace root)
        working-directory: .
        run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  ci:
    name: ci
    needs: [worker, mcp]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require worker and mcp
        run: |
          test "${{ needs.worker.result }}" = "success"
          test "${{ needs.mcp.result }}" = "success"
